name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4001
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test
      JWT_SECRET: ci-only-secret-do-not-reuse
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci

      - name: Create database schema
        run: npm run db:schema

      - name: Run backend automated tests
        run: npm test

      - name: Install frontend dependencies
        run: npm ci --prefix client

      - name: Build frontend
        run: npm run build --prefix client

      - name: Check frontend lint
        run: npm run lint --prefix client
